name: APK Android

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Installa dipendenze
        run: npm ci

      - name: Copia l'app nel progetto Android
        run: npx cap sync android

      - name: Compila APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../SchedeAllenamento.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SchedeAllenamento-apk
          path: app/SchedeAllenamento.apk

      - name: Pubblica la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Schede Allenamento 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: app/SchedeAllenamento.apk
          body: |
            APK da installare sul telefono Android.
            Scarica **SchedeAllenamento.apk** qui sotto, aprilo e consenti l'installazione da origini sconosciute quando richiesto.
            Ogni nuova versione si installa sopra la precedente senza perdere i dati.
